<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="572" viewBox="0 0 1120 572" role="img" aria-labelledby="title desc">
<title id="title">VPN traffic and panel access take different paths</title>
<desc id="desc">These are example ports, not values every installation must use. Conceptual network and setup diagram.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#236bb0"/></marker></defs>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="572" rx="12" fill="#f4f7fb" stroke="none"/>
<rect x="20" y="20" width="1080" height="112" rx="12" fill="#14283f" stroke="none"/>
<text x="44" y="60" font-size="26" fill="#ffffff" font-weight="700">VPN traffic and panel access take different paths</text>
<text x="44" y="98" font-size="15" fill="#c7d7eb" font-weight="400">These are example ports, not values every installation must use.</text>
<text x="40" y="162" font-size="17" fill="#203c5a" font-weight="700">Website traffic through the VPN</text>
<rect x="40.0" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="54.0" y="209" font-size="17" fill="#114b91" font-weight="700">Browser / application</text>
<text x="54.0" y="237" font-size="14" fill="#53657d" font-weight="400">Uses the selected local</text>
<text x="54.0" y="255" font-size="14" fill="#53657d" font-weight="400">proxy</text>
<line x1="275.5" y1="239" x2="304.5" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="309.5" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="323.5" y="209" font-size="17" fill="#114b91" font-weight="700">This computer :12334</text>
<text x="323.5" y="237" font-size="14" fill="#53657d" font-weight="400">Hiddify&#x27;s local proxy</text>
<text x="323.5" y="255" font-size="14" fill="#53657d" font-weight="400">listener</text>
<line x1="545.0" y1="239" x2="574.0" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="579.0" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="593.0" y="209" font-size="17" fill="#114b91" font-weight="700">VPS :443 or :8443</text>
<text x="593.0" y="237" font-size="14" fill="#53657d" font-weight="400">Public VPN listener</text>
<line x1="814.5" y1="239" x2="843.5" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="848.5" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="862.5" y="209" font-size="17" fill="#114b91" font-weight="700">Website :443</text>
<text x="862.5" y="237" font-size="14" fill="#53657d" font-weight="400">The destination&#x27;s HTTPS</text>
<text x="862.5" y="255" font-size="14" fill="#53657d" font-weight="400">service</text>
<text x="40" y="337" font-size="17" fill="#203c5a" font-weight="700">Direct browser access to the server dashboard</text>
<rect x="40.0" y="355" width="501.0" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="54.0" y="384" font-size="17" fill="#114b91" font-weight="700">Your browser</text>
<text x="54.0" y="412" font-size="14" fill="#53657d" font-weight="400">Open the full saved HTTP URL</text>
<line x1="545.0" y1="414" x2="574.0" y2="414" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="579.0" y="355" width="501.0" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="593.0" y="384" font-size="17" fill="#114b91" font-weight="700">VPS :27297</text>
<text x="593.0" y="412" font-size="14" fill="#53657d" font-weight="400">Public administration panel</text>
<text x="40" y="552" font-size="14" fill="#53657d" font-weight="400">Conceptual scheme. Follow the adjacent guide for exact settings, button paths and verification.</text>
</g>
</svg>
