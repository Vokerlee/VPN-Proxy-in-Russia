<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="571" viewBox="0 0 1120 571" role="img" aria-labelledby="title desc">
<title id="title">Copy a usable client profile</title>
<desc id="desc">Numbered navigation illustration. This is not a captured screenshot. Exact positions may differ by version.</desc>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="571" rx="12" fill="#f4f7fb" stroke="none"/>
<rect x="20" y="20" width="1080" height="112" rx="12" fill="#14283f" stroke="none"/>
<text x="44" y="60" font-size="27" fill="#ffffff" font-weight="700">Copy a usable client profile</text>
<text x="44" y="96" font-size="16" fill="#c7d7eb" font-weight="400">3x-ui 3.8.5  |  Navigation diagram, not a screenshot</text>
<rect x="44" y="152" width="1046" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="69" cy="181" r="16" fill="#0b62b9"/>
<text x="64" y="187" font-size="16" fill="white" font-weight="700">1</text>
<text x="95" y="183" font-size="17" fill="#172b4d" font-weight="400">In client connection details</text>
<rect x="95" y="194" width="180" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="108" y="215" font-size="15" fill="#074985" font-weight="700">Copy VLESS URL</text>
<text x="95" y="243" font-size="13" fill="#53657d" font-weight="400">vless://YOUR_UUID@YOUR_SERVER_IP:443?...</text>
<rect x="44" y="267" width="1046" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="69" cy="296" r="16" fill="#0b62b9"/>
<text x="64" y="302" font-size="16" fill="white" font-weight="700">2</text>
<text x="95" y="298" font-size="17" fill="#172b4d" font-weight="400">On another device</text>
<rect x="95" y="309" width="180" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="108" y="330" font-size="15" fill="#074985" font-weight="700">Show QR code</text>
<text x="95" y="358" font-size="13" fill="#53657d" font-weight="400">A QR code grants the same access as the complete connection link.</text>
<rect x="44" y="382" width="1046" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="69" cy="411" r="16" fill="#0b62b9"/>
<text x="64" y="417" font-size="16" fill="white" font-weight="700">3</text>
<text x="95" y="413" font-size="17" fill="#172b4d" font-weight="400">In Hiddify</text>
<rect x="95" y="424" width="241.20000000000002" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="108" y="445" font-size="15" fill="#074985" font-weight="700">+  &gt;  Add from clipboard</text>
<text x="95" y="473" font-size="13" fill="#53657d" font-weight="400">Select the newly imported profile before pressing Connect.</text>
<text x="34" y="549" font-size="14" fill="#53657d" font-weight="400">Follow the adjacent guide for checks and version-specific alternatives. All values shown are placeholders.</text>
</g>
</svg>
