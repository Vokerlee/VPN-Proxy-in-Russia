<text x="336" y="330" font-size="15" fill="#074985" font-weight="700">Fingerprint / uTLS &gt; Safari</text>
<text x="323" y="358" font-size="13" fill="#53657d" font-weight="400">Tested for this Hiddify symptom on US and non-US connections.</text>
