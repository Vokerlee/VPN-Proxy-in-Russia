<text x="336" y="215" font-size="15" fill="#074985" font-weight="700">Inbounds &gt; Edit</text>
<text x="323" y="243" font-size="13" fill="#53657d" font-weight="400">Keep the current port, UUID, keys, short ID, SNI and Flow.</text>
<rect x="272" y="267" width="818" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
