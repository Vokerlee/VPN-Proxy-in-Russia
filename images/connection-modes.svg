<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="747" viewBox="0 0 1120 747" role="img" aria-labelledby="title desc">
<title id="title">One Connect button, three scopes</title>
<desc id="desc">Choose the scope deliberately; a running app does not automatically capture every request. Conceptual network and setup diagram.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#236bb0"/></marker></defs>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="747" rx="12" fill="#f4f7fb" stroke="none"/>
<rect x="20" y="20" width="1080" height="112" rx="12" fill="#14283f" stroke="none"/>
<text x="44" y="60" font-size="26" fill="#ffffff" font-weight="700">One Connect button, three scopes</text>
<text x="44" y="98" font-size="15" fill="#c7d7eb" font-weight="400">Choose the scope deliberately; a running app does not automatically capture every request.</text>
<text x="40" y="162" font-size="17" fill="#203c5a" font-weight="700">Proxy / manual mode</text>
<rect x="40.0" y="180" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="54.0" y="209" font-size="17" fill="#114b91" font-weight="700">Chosen application</text>
<text x="54.0" y="237" font-size="14" fill="#53657d" font-weight="400">Explicitly uses the local proxy</text>
<line x1="365.3333333333333" y1="239" x2="394.3333333333333" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="399.3333333333333" y="180" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="413.3333333333333" y="209" font-size="17" fill="#114b91" font-weight="700">Local proxy</text>
<text x="413.3333333333333" y="237" font-size="14" fill="#53657d" font-weight="400">Forwards this application&#x27;s requests</text>
<line x1="724.6666666666666" y1="239" x2="753.6666666666666" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="758.6666666666666" y="180" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="772.6666666666666" y="209" font-size="17" fill="#114b91" font-weight="700">Rented server</text>
<text x="772.6666666666666" y="237" font-size="14" fill="#53657d" font-weight="400">Opens the destination connection</text>
<text x="40" y="337" font-size="17" fill="#203c5a" font-weight="700">System Proxy mode</text>
<rect x="40.0" y="355" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="54.0" y="384" font-size="17" fill="#114b91" font-weight="700">Proxy-aware apps</text>
<text x="54.0" y="412" font-size="14" fill="#53657d" font-weight="400">Follow Windows&#x27; proxy setting</text>
<line x1="365.3333333333333" y1="414" x2="394.3333333333333" y2="414" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="399.3333333333333" y="355" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="413.3333333333333" y="384" font-size="17" fill="#114b91" font-weight="700">Selected local proxy</text>
<text x="413.3333333333333" y="412" font-size="14" fill="#53657d" font-weight="400">One chosen endpoint, not two merged</text>
<text x="413.3333333333333" y="430" font-size="14" fill="#53657d" font-weight="400">clients</text>
<line x1="724.6666666666666" y1="414" x2="753.6666666666666" y2="414" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="758.6666666666666" y="355" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="772.6666666666666" y="384" font-size="17" fill="#114b91" font-weight="700">Rented server</text>
<text x="772.6666666666666" y="412" font-size="14" fill="#53657d" font-weight="400">Carries the selected requests</text>
<text x="40" y="512" font-size="17" fill="#203c5a" font-weight="700">VPN / TUN mode</text>
<rect x="40.0" y="530" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="54.0" y="559" font-size="17" fill="#114b91" font-weight="700">Routed app traffic</text>
<text x="54.0" y="587" font-size="14" fill="#53657d" font-weight="400">Subject to route and bypass rules</text>
<line x1="365.3333333333333" y1="589" x2="394.3333333333333" y2="589" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="399.3333333333333" y="530" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="413.3333333333333" y="559" font-size="17" fill="#114b91" font-weight="700">Virtual interface</text>
<text x="413.3333333333333" y="587" font-size="14" fill="#53657d" font-weight="400">Captures traffic using OS networking</text>
<line x1="724.6666666666666" y1="589" x2="753.6666666666666" y2="589" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="758.6666666666666" y="530" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="772.6666666666666" y="559" font-size="17" fill="#114b91" font-weight="700">Rented server</text>
<text x="772.6666666666666" y="587" font-size="14" fill="#53657d" font-weight="400">Carries the configured traffic</text>
<text x="40" y="727" font-size="14" fill="#53657d" font-weight="400">Conceptual scheme. Follow the adjacent guide for exact settings, button paths and verification.</text>
</g>
</svg>
