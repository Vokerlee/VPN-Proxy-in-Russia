<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="686" viewBox="0 0 1120 686" role="img" aria-labelledby="title desc">
<title id="title">Choose IPv4 on the VPS outbound</title>
<desc id="desc">Numbered navigation illustration. This is not a captured screenshot. Exact positions may differ by version.</desc>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="686" rx="12" fill="#f4f7fb" stroke="none"/>
<rect x="20" y="20" width="1080" height="112" rx="12" fill="#14283f" stroke="none"/>
<text x="44" y="60" font-size="27" fill="#ffffff" font-weight="700">Choose IPv4 on the VPS outbound</text>
<text x="44" y="96" font-size="16" fill="#c7d7eb" font-weight="400">3x-ui 3.8.5  |  Navigation diagram, not a screenshot</text>
<rect x="28" y="152" width="216" height="460" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<text x="48" y="185" font-size="13" fill="#60738d" font-weight="700">NAVIGATION</text>
<text x="49" y="205" font-size="14" fill="#53657d" font-weight="400">Dashboard</text>
<text x="49" y="248" font-size="14" fill="#53657d" font-weight="400">Inbounds</text>
<rect x="38" y="271" width="196" height="35" rx="12" fill="#dbeafe" stroke="none"/>
<text x="49" y="291" font-size="14" fill="#114b91" font-weight="700">Outbounds</text>
<text x="49" y="334" font-size="14" fill="#53657d" font-weight="400">Routing</text>
<text x="49" y="377" font-size="14" fill="#53657d" font-weight="400">Xray Settings</text>
<rect x="272" y="152" width="818" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="297" cy="181" r="16" fill="#0b62b9"/>
<text x="292" y="187" font-size="16" fill="white" font-weight="700">1</text>
<text x="323" y="183" font-size="17" fill="#172b4d" font-weight="400">Use the separate main menu item</text>
<rect x="323" y="194" width="180" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="336" y="215" font-size="15" fill="#074985" font-weight="700">Outbounds</text>
<text x="323" y="243" font-size="13" fill="#53657d" font-weight="400">It is outside the Xray Settings submenu in this version.</text>
<rect x="272" y="267" width="818" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="297" cy="296" r="16" fill="#0b62b9"/>
<text x="292" y="302" font-size="16" fill="white" font-weight="700">2</text>
<text x="323" y="298" font-size="17" fill="#172b4d" font-weight="400">Find tag direct, protocol freedom</text>
<rect x="323" y="309" width="180" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="336" y="330" font-size="15" fill="#074985" font-weight="700">Edit</text>
<text x="323" y="358" font-size="13" fill="#53657d" font-weight="400">Choose the outbound your routing actually uses.</text>
<rect x="272" y="382" width="818" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="297" cy="411" r="16" fill="#0b62b9"/>
<text x="292" y="417" font-size="16" fill="white" font-weight="700">3</text>
<text x="323" y="413" font-size="17" fill="#172b4d" font-weight="400">Open Strategy / Domain Strategy</text>
<rect x="323" y="424" width="180" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="336" y="445" font-size="15" fill="#074985" font-weight="700">ForceIPv4</text>
<text x="323" y="473" font-size="13" fill="#53657d" font-weight="400">This is not Routing &gt; Domain Strategy.</text>
<rect x="272" y="497" width="818" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="297" cy="526" r="16" fill="#0b62b9"/>
<text x="292" y="532" font-size="16" fill="white" font-weight="700">4</text>
<text x="323" y="528" font-size="17" fill="#172b4d" font-weight="400">Apply the change</text>
<rect x="323" y="539" width="180" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="336" y="560" font-size="15" fill="#074985" font-weight="700">Save</text>
<text x="323" y="588" font-size="13" fill="#53657d" font-weight="400">Restart Xray if prompted, then run a fresh exit-IP test.</text>
<text x="34" y="664" font-size="14" fill="#53657d" font-weight="400">Follow the adjacent guide for checks and version-specific alternatives. All values shown are placeholders.</text>
