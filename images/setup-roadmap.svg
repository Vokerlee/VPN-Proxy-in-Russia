<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="397" viewBox="0 0 1120 397" role="img" aria-labelledby="title desc">
<title id="title">The whole setup in four steps</title>
<desc id="desc">Start at the first step you have not completed. Scripts are optional. Conceptual network and setup diagram.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#236bb0"/></marker></defs>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="397" rx="12" fill="#f4f7fb" stroke="none"/>
<rect x="20" y="20" width="1080" height="112" rx="12" fill="#14283f" stroke="none"/>
<text x="44" y="60" font-size="26" fill="#ffffff" font-weight="700">The whole setup in four steps</text>
<text x="44" y="98" font-size="15" fill="#c7d7eb" font-weight="400">Start at the first step you have not completed. Scripts are optional.</text>
<text x="40" y="162" font-size="17" fill="#203c5a" font-weight="700">The manual walkthrough</text>
<rect x="40.0" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="54.0" y="209" font-size="17" fill="#114b91" font-weight="700">1. Get a server</text>
<text x="54.0" y="237" font-size="14" fill="#53657d" font-weight="400">Choose Ubuntu and save</text>
<text x="54.0" y="255" font-size="14" fill="#53657d" font-weight="400">login details</text>
<line x1="275.5" y1="239" x2="304.5" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="309.5" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="323.5" y="209" font-size="17" fill="#114b91" font-weight="700">2. Install its</text>
<text x="323.5" y="230" font-size="17" fill="#114b91" font-weight="700">dashboard</text>
<text x="323.5" y="258" font-size="14" fill="#53657d" font-weight="400">Open the dashboard in a</text>
<text x="323.5" y="276" font-size="14" fill="#53657d" font-weight="400">browser</text>
<line x1="545.0" y1="239" x2="574.0" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="579.0" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="593.0" y="209" font-size="17" fill="#114b91" font-weight="700">3. Create an account</text>
<text x="593.0" y="237" font-size="14" fill="#53657d" font-weight="400">Copy the private connection</text>
<text x="593.0" y="255" font-size="14" fill="#53657d" font-weight="400">link</text>
<line x1="814.5" y1="239" x2="843.5" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="848.5" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="862.5" y="209" font-size="17" fill="#114b91" font-weight="700">4. Connect your device</text>
<text x="862.5" y="237" font-size="14" fill="#53657d" font-weight="400">Import the link and check</text>
<text x="862.5" y="255" font-size="14" fill="#53657d" font-weight="400">the result</text>
<text x="40" y="377" font-size="14" fill="#53657d" font-weight="400">Conceptual scheme. Follow the adjacent guide for exact settings, button paths and verification.</text>
</g>
</svg>
