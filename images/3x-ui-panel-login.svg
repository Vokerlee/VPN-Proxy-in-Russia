<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="571" viewBox="0 0 1120 571" role="img" aria-labelledby="title desc">
<title id="title">Open the administration panel</title>
<desc id="desc">Numbered navigation illustration. This is not a captured screenshot. Exact positions may differ by version.</desc>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="571" rx="12" fill="#f4f7fb" stroke="none"/>
<rect x="20" y="20" width="1080" height="112" rx="12" fill="#14283f" stroke="none"/>
<text x="44" y="60" font-size="27" fill="#ffffff" font-weight="700">Open the administration panel</text>
<text x="44" y="96" font-size="16" fill="#c7d7eb" font-weight="400">3x-ui 3.8.5  |  Navigation diagram, not a screenshot</text>
<rect x="44" y="152" width="1046" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="69" cy="181" r="16" fill="#0b62b9"/>
<text x="64" y="187" font-size="16" fill="white" font-weight="700">1</text>
<text x="95" y="183" font-size="17" fill="#172b4d" font-weight="400">Keep the SSH forwarding window open</text>
<rect x="95" y="194" width="320.40000000000003" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="108" y="215" font-size="15" fill="#074985" font-weight="700">http://127.0.0.1:18080/YOUR_PATH/</text>
<text x="95" y="243" font-size="13" fill="#53657d" font-weight="400">Open this on your computer. Replace YOUR_PATH with the saved panel path.</text>
<rect x="44" y="267" width="1046" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="69" cy="296" r="16" fill="#0b62b9"/>
<text x="64" y="302" font-size="16" fill="white" font-weight="700">2</text>
<text x="95" y="298" font-size="17" fill="#172b4d" font-weight="400">Enter the panel credentials</text>
<rect x="95" y="309" width="197.20000000000002" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="108" y="330" font-size="15" fill="#074985" font-weight="700">Username + password</text>
<text x="95" y="358" font-size="13" fill="#53657d" font-weight="400">Use the panel login, not the root password.</text>
<rect x="44" y="382" width="1046" height="102" rx="12" fill="#ffffff" stroke="#d8e1ed"/>
<circle cx="69" cy="411" r="16" fill="#0b62b9"/>
<text x="64" y="417" font-size="16" fill="white" font-weight="700">3</text>
<text x="95" y="413" font-size="17" fill="#172b4d" font-weight="400">Sign in</text>
<rect x="95" y="424" width="180" height="30" rx="7" fill="#e7f1fd" stroke="#6a9dd4"/>
<text x="108" y="445" font-size="15" fill="#074985" font-weight="700">Login</text>
<text x="95" y="473" font-size="13" fill="#53657d" font-weight="400">Confirm the panel and Xray versions on the dashboard.</text>
<text x="34" y="549" font-size="14" fill="#53657d" font-weight="400">Follow the adjacent guide for checks and version-specific alternatives. All values shown are placeholders.</text>
</g>
</svg>
