<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="572" viewBox="0 0 1120 572" role="img" aria-labelledby="title desc">
<title id="title">Find the first stage that fails</title>
<desc id="desc">A successful early check does not prove that the later stages work. Conceptual network and setup diagram.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#236bb0"/></marker></defs>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="0" y="0" width="1120" height="572" rx="12" fill="#f4f7fb" stroke="none"/>
<rect x="20" y="20" width="1080" height="112" rx="12" fill="#14283f" stroke="none"/>
<text x="44" y="60" font-size="26" fill="#ffffff" font-weight="700">Find the first stage that fails</text>
<text x="44" y="98" font-size="15" fill="#c7d7eb" font-weight="400">A successful early check does not prove that the later stages work.</text>
<text x="40" y="162" font-size="17" fill="#203c5a" font-weight="700">Follow the request</text>
<rect x="40.0" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="54.0" y="209" font-size="17" fill="#114b91" font-weight="700">1. Local app</text>
<text x="54.0" y="237" font-size="14" fill="#53657d" font-weight="400">Is the intended proxy</text>
<text x="54.0" y="255" font-size="14" fill="#53657d" font-weight="400">listening?</text>
<line x1="275.5" y1="239" x2="304.5" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="309.5" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="323.5" y="209" font-size="17" fill="#114b91" font-weight="700">2. Server port</text>
<text x="323.5" y="237" font-size="14" fill="#53657d" font-weight="400">Can this network reach the</text>
<text x="323.5" y="255" font-size="14" fill="#53657d" font-weight="400">VPN port?</text>
<line x1="545.0" y1="239" x2="574.0" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="579.0" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="593.0" y="209" font-size="17" fill="#114b91" font-weight="700">3. Account handshake</text>
<text x="593.0" y="237" font-size="14" fill="#53657d" font-weight="400">Does the profile</text>
<text x="593.0" y="255" font-size="14" fill="#53657d" font-weight="400">authenticate?</text>
<line x1="814.5" y1="239" x2="843.5" y2="239" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="848.5" y="180" width="231.5" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="862.5" y="209" font-size="17" fill="#114b91" font-weight="700">4. Website request</text>
<text x="862.5" y="237" font-size="14" fill="#53657d" font-weight="400">Does HTTPS work through the</text>
<text x="862.5" y="255" font-size="14" fill="#53657d" font-weight="400">proxy?</text>
<text x="40" y="337" font-size="17" fill="#203c5a" font-weight="700">Then check the application you actually use</text>
<rect x="40.0" y="355" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="54.0" y="384" font-size="17" fill="#114b91" font-weight="700">Explicit proxy test works</text>
<text x="54.0" y="412" font-size="14" fill="#53657d" font-weight="400">The profile and that route are usable</text>
<line x1="365.3333333333333" y1="414" x2="394.3333333333333" y2="414" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="399.3333333333333" y="355" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="413.3333333333333" y="384" font-size="17" fill="#114b91" font-weight="700">Browser still unchanged</text>
<text x="413.3333333333333" y="412" font-size="14" fill="#53657d" font-weight="400">Check system proxy or application rules</text>
<line x1="724.6666666666666" y1="414" x2="753.6666666666666" y2="414" stroke="#236bb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="758.6666666666666" y="355" width="321.3333333333333" height="118" rx="12" fill="#ffffff" stroke="#9bb8d7"/>
<text x="772.6666666666666" y="384" font-size="17" fill="#114b91" font-weight="700">IP is unexpected</text>
<text x="772.6666666666666" y="412" font-size="14" fill="#53657d" font-weight="400">Compare direct and server egress</text>
<text x="40" y="552" font-size="14" fill="#53657d" font-weight="400">Conceptual scheme. Follow the adjacent guide for exact settings, button paths and verification.</text>
</g>
</svg>
