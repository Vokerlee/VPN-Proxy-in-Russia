<rect x="20" y="20" width="1080" height="112" rx="12" fill="#14283f" stroke="none"/>
<text x="44" y="60" font-size="26" fill="#ffffff" font-weight="700">What you are building</text>
<text x="44" y="98" font-size="15" fill="#c7d7eb" font-weight="400">Your device reaches websites through the server you control.</text>
